# Sandbox Environment Configuration

# App Configuration
app.package=com.espresso.framework.sbx
app.activity=.MainActivity

# Test Timeouts (in seconds)
test.timeout.default=10
test.timeout.explicit=20
test.timeout.implicit=5

# Screenshot Settings
screenshot.onFailure=true
screenshot.onPass=false
screenshot.directory=reports/screenshots/

# Video Recording
video.record=false
video.directory=reports/videos/

# Retry Configuration
test.retry.count=2
test.retry.delay=1000

# Animation Settings
animations.disable=true

# Idling Resource
idling.timeout=30000

# Logging
log.level=INFO

# Environment URLs (Sandbox)
app.baseUrl=https://sbx.example.com
api.baseUrl=https://api.sbx.example.com
deeplink.scheme=myapp-sbx

# Test Credentials (Sandbox)
test.username=sbx.user@example.com
test.password=SbxPass1234!
test.apiKey=sbx_api_key_12345
