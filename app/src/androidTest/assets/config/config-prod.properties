# Production Environment Configuration

# App Configuration
app.package=com.espresso.framework
app.activity=.MainActivity

# Test Timeouts (in seconds)
test.timeout.default=10
test.timeout.explicit=20
test.timeout.implicit=5

# Screenshot Settings
screenshot.onFailure=true
screenshot.onPass=false
screenshot.directory=reports/screenshots/

# Video Recording
video.record=false
video.directory=reports/videos/

# Retry Configuration
test.retry.count=1
test.retry.delay=1000

# Animation Settings
animations.disable=true

# Idling Resource
idling.timeout=30000

# Logging
log.level=WARN

# Environment URLs (Production)
app.baseUrl=https://example.com
api.baseUrl=https://api.example.com
deeplink.scheme=myapp

# Test Credentials (Production)
test.username=prod.user@example.com
test.password=ProdPass1234!
test.apiKey=prod_api_key_12345
