# QA Environment Configuration

# App Configuration
app.package=com.espresso.framework.qa
app.activity=.MainActivity

# Test Timeouts (in seconds)
test.timeout.default=10
test.timeout.explicit=20
test.timeout.implicit=5

# Screenshot Settings
screenshot.onFailure=true
screenshot.onPass=false
screenshot.directory=reports/screenshots/

# Video Recording
video.record=true
video.directory=reports/videos/

# Retry Configuration
test.retry.count=2
test.retry.delay=1000

# Animation Settings
animations.disable=true

# Idling Resource
idling.timeout=30000

# Logging
log.level=INFO

# Environment URLs (QA)
app.baseUrl=https://qa.example.com
api.baseUrl=https://api.qa.example.com
deeplink.scheme=myapp-qa

# Test Credentials (QA)
test.username=qa.user@example.com
test.password=QaPass1234!
test.apiKey=qa_api_key_12345
