# Default Configuration for Espresso Framework

# App Configuration
app.package=com.espresso.framework
app.activity=.MainActivity

# Test Timeouts (in seconds)
test.timeout.default=10
test.timeout.explicit=20
test.timeout.implicit=5

# Screenshot Settings
screenshot.onFailure=true
screenshot.onPass=false
screenshot.directory=reports/screenshots/

# Video Recording
video.record=false
video.directory=reports/videos/

# Retry Configuration
test.retry.count=2
test.retry.delay=1000

# Animation Settings
animations.disable=true

# Idling Resource
idling.timeout=30000

# Logging
log.level=INFO

# Environment URLs (default)
app.baseUrl=https://default.example.com
api.baseUrl=https://api.default.example.com
deeplink.scheme=myapp

# Test Credentials (default)
test.username=test@example.com
test.password=Test1234!
