# Development Environment Configuration

# App Configuration
app.package=com.espresso.framework.dev
app.activity=.MainActivity

# Test Timeouts (in seconds)
test.timeout.default=15
test.timeout.explicit=30
test.timeout.implicit=5

# Screenshot Settings
screenshot.onFailure=true
screenshot.onPass=true
screenshot.directory=reports/screenshots/

# Video Recording
video.record=true
video.directory=reports/videos/

# Retry Configuration
test.retry.count=3
test.retry.delay=1500

# Animation Settings
animations.disable=true

# Idling Resource
idling.timeout=45000

# Logging
log.level=DEBUG

# Environment URLs (Development)
app.baseUrl=https://dev.example.com
api.baseUrl=https://api.dev.example.com
deeplink.scheme=myapp-dev

# Test Credentials (Development)
test.username=dev.user@example.com
test.password=DevPass1234!
test.apiKey=dev_api_key_12345
